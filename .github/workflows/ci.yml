name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt ruff
      - name: Lint
        run: ruff check .
      - name: Unit tests
        run: python -m pytest -v

  kafka-integration:
    # real broker: produce -> consume -> KPI windows, end to end
    runs-on: ubuntu-latest
    needs: test
    services:
      kafka:
        image: apache/kafka:3.8.0
        ports:
          - 9092:9092
        options: >-
          --health-cmd "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"
          --health-interval 5s
          --health-timeout 10s
          --health-retries 20
    env:
      KAFKA_BOOTSTRAP_SERVERS: localhost:9092
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Integration test
        run: python -m pytest tests/integration -v -rs

  incident-demo:
    # 60-minute simulated run with injected incidents; KPIs + alerts uploaded as an artifact
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Simulate incidents
        run: |
          python simulate.py --minutes 60 \
            --error-spike pharmacy:20:24:0.12 --volume-drop eligibility:28:31:0.2 \
            --late-burst claims:33:35:0.4 --error-spike claims:45:49:0.06
      - uses: actions/upload-artifact@v4
        with:
          name: kpi-output
          path: output/*.csv
